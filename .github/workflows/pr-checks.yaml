name: PR Checks

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zod: ['3', '4']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm install --no-save zod@${{ matrix.zod }}
      - run: npm run lint
      - run: npm run test
      - run: npm run build
